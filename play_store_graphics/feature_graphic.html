<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanisa Feature Graphic - 1024x500</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a2e;
            padding: 20px;
            gap: 20px;
        }
        
        .download-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
        }
        
        .download-btn:hover {
            background: #45a049;
        }
        
        .size-info {
            color: #888;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
        }
        
        .feature-graphic {
            width: 1024px;
            height: 500px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #1e3c72 100%);
            border-radius: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 60px 80px;
            position: relative;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
        }
        
        .feature-graphic::before {
            content: '';
            position: absolute;
            top: -100px;
            right: -100px;
            width: 400px;
            height: 400px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
        }
        
        .feature-graphic::after {
            content: '';
            position: absolute;
            bottom: -150px;
            left: -150px;
            width: 500px;
            height: 500px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 50%;
        }
        
        .content {
            z-index: 1;
            max-width: 550px;
        }
        
        .app-name {
            font-size: 72px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .tagline {
            font-size: 28px;
            color: #e8e8e8;
            margin-bottom: 30px;
            font-weight: 400;
        }
        
        .features {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
        }
        
        .feature-item {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #ffffff;
            font-size: 16px;
        }
        
        .feature-icon {
            width: 24px;
            height: 24px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }
        
        .logo-section {
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .app-icon {
            width: 200px;
            height: 200px;
            background: #ffffff;
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .app-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .church-icon {
            font-size: 100px;
        }
        
        .church-name {
            margin-top: 20px;
            color: #ffffff;
            font-size: 18px;
            opacity: 0.9;
        }
        
        .cross {
            position: absolute;
            right: 50px;
            top: 30px;
            font-size: 60px;
            color: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <button class="download-btn" onclick="downloadImage()">📥 Download Feature Graphic (1024x500)</button>
    <p class="size-info">Exact size: 1024 x 500 pixels - Ready for Play Store</p>
    
    <div class="feature-graphic" id="capture">
        <div class="cross">✝</div>
        
        <div class="content">
            <h1 class="app-name">Kanisa</h1>
            <p class="tagline">Your Church Community App</p>
            <div class="features">
                <div class="feature-item">
                    <div class="feature-icon">📅</div>
                    <span>Events</span>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">📖</div>
                    <span>Bible</span>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">🎵</div>
                    <span>Sermons</span>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">💝</div>
                    <span>Giving</span>
                </div>
            </div>
        </div>
        
        <div class="logo-section">
            <div class="app-icon">
                <span class="church-icon">⛪</span>
            </div>
            <p class="church-name">Kirigiti PCEA Church</p>
        </div>
    </div>

    <script>
        function downloadImage() {
            const element = document.getElementById('capture');
            html2canvas(element, {
                width: 1024,
                height: 500,
                scale: 1,
                useCORS: true,
                backgroundColor: null
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'kanisa_feature_graphic.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }
    </script>
</body>
</html>
